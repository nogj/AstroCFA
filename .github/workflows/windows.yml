name: Windows

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows MSVC x64
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite

    steps:
      - name: Check out sources
        uses: actions/checkout@v5

      - name: Bootstrap vcpkg if needed
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
          } else {
            "Using vcpkg at $env:VCPKG_ROOT"
          }

      - name: Cache vcpkg downloads and binaries
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.VCPKG_ROOT }}\downloads
            ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-windows-x64-v2-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-x64-v2-

      - name: Install dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --triplet x64-windows `
            --x-manifest-root="$env:GITHUB_WORKSPACE" `
            --x-install-root="$env:GITHUB_WORKSPACE\build\vcpkg_installed"

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DVCPKG_INSTALLED_DIR="$env:GITHUB_WORKSPACE\build\vcpkg_installed"
          -DVCPKG_MANIFEST_INSTALL=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
